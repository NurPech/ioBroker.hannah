name: Auto-Build

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'src/**'
      - 'admin/src/**'
      - 'package.json'
      - 'tsconfig*.json'
      - 'admin/tsconfig*.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: rebuild [skip ci]'
          file_pattern: 'build/** admin/build/**'
