name: Auto-Build

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - 'src/**'
      - 'admin/src/**'
      - 'package.json'
      - 'tsconfig*.json'
      - 'admin/tsconfig*.json'

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Commit build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/ admin/build/
          git diff --cached --quiet && echo "Nothing to commit" || (git commit -m 'chore: rebuild' && git push)
